<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FoodsUp</title>
<meta name="description" content="Groepsbestellingen in een paar tikken — werkt offline.">
<meta name="theme-color" content="#1a1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FoodsUp">
<style>
  /* Fonts via system stack — works fully offline */

  :root {
    --bg: #1a1410; --card: #252018; --card2: #2e2820;
    --accent: #e8a23a; --accent2: #c4622d;
    --text: #f0e8d8; --muted: #8a7d68;
    --success: #6aaa64; --danger: #c0392b; --border: #3d3528;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body.lang-ne { font-family: 'Noto Sans Devanagari', 'Mangal', Arial Unicode MS, sans-serif; }

  .screen { display: none; min-height: 100vh; flex-direction: column; max-width: 680px; margin: 0 auto; }
  .screen.active { display: flex; }

  .header { background: linear-gradient(135deg,#2e1f0a,#1a1410); border-bottom: 2px solid var(--accent); padding: calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 10px calc(20px + env(safe-area-inset-left)); position: sticky; top: 0; z-index: 10; }
  .content { padding-bottom: env(safe-area-inset-bottom) !important; }
  .header-title { font-family: Georgia, serif; font-size: 20px; font-weight: 900; color: var(--accent); }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .header-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }

  /* LANG SWITCHER */
  .lang-switcher { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-left: auto; }
  .lang-btn { padding: 5px 10px; font-size: 12px; font-weight: 700; border: none; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .lang-btn.active { background: var(--accent); color: #1a1410; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; transition: all 0.15s; user-select: none; text-decoration: none; }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: #1a1410; }
  .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-warn { background: #7a5c10; color: var(--accent); border: 1px solid #a07820; }
  .btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
  .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 8px; font-size: 15px; flex: none; }
  .btn-full { width: 100%; }
  .btn-lg { padding: 15px 18px; font-size: 16px; border-radius: 12px; }

  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

  /* HOME */
  #home .content { padding: 20px; flex: 1; }
  .welcome-text { font-family: Georgia, serif; font-size: 26px; font-weight: 900; line-height: 1.2; margin-bottom: 6px; }
  .welcome-text span { color: var(--accent); }
  .welcome-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .theme-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 14px 12px 32px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; }
  .theme-card:active { transform: scale(0.97); }
  .theme-card.selected { border-color: var(--accent); background: #2e2515; }
  .theme-card.selected::after { content: '✓'; position: absolute; top: 8px; right: 10px; color: var(--accent); font-size: 14px; font-weight: 700; }
  .theme-card.add { border-style: dashed; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 12px; color: var(--muted); min-height: 96px; }
  .theme-card.add .theme-emoji { font-size: 24px; margin: 0; }
  .theme-emoji { font-size: 26px; margin-bottom: 5px; }
  .theme-name { font-weight: 600; font-size: 14px; }
  .theme-count { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .theme-edit-btn { position: absolute; bottom: 8px; right: 8px; background: var(--card2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .theme-card.selected .theme-edit-btn { background: #3a2e18; border-color: #6a5020; color: var(--accent); }
  .theme-actions { display: flex; gap: 8px; margin-bottom: 28px; }

  .history-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .history-item:active { border-color: var(--accent); }
  .history-left { flex: 1; min-width: 0; }
  .history-title { font-weight: 600; font-size: 14px; }
  .history-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .history-summary { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-arrow { color: var(--muted); font-size: 18px; }

  /* ORDER / THEME EDIT */
  #order .content, #themeedit .content { padding: 16px; flex: 1; }
  .round-info { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .round-theme { font-family: Georgia, serif; font-size: 18px; font-weight: 700; color: var(--accent); }
  .round-badge { background: var(--accent2); color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .options-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .option-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .option-item { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .option-item.editing { border-color: var(--accent); }
  .option-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; background: transparent; border: none; color: var(--text); font-family: inherit; outline: none; }
  .option-name::placeholder { color: var(--muted); }
  .price-input { width: 74px; flex: none; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; color: var(--text); font-family: inherit; font-size: 14px; text-align: right; outline: none; }
  .price-input:focus { border-color: var(--accent); }
  .price-input::placeholder { color: var(--muted); }
  .add-option-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-option-input { flex: 1; min-width: 0; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; }
  .add-option-input:focus { border-color: var(--accent); }
  .add-option-input::placeholder { color: var(--muted); }
  textarea.add-option-input { width: 100%; resize: vertical; line-height: 1.5; }
  .save-to-theme-bar { background: #2a2010; border: 1px solid #5a4010; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .save-to-theme-label { font-size: 13px; color: var(--accent); }
  .te-name-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .subs-badge { font-size: 11px; color: var(--accent); font-weight: 700; white-space: nowrap; }

  /* VOTE */
  #vote .content { padding: 16px; flex: 1; }
  .voter-name-display { font-family: Georgia, serif; font-size: 26px; font-weight: 900; color: var(--text); margin-bottom: 4px; }
  .voter-prompt { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  .vote-options { display: flex; flex-direction: column; gap: 10px; }
  .vote-row { display: flex; gap: 8px; align-items: stretch; }
  .vote-option { flex: 1; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 18px 20px; cursor: pointer; font-size: 17px; font-weight: 600; transition: all 0.15s; text-align: left; color: var(--text); width: 100%; font-family: inherit; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .vote-option:active { transform: scale(0.98); }
  .vote-option.selected { border-color: var(--accent); background: #2e2515; color: var(--accent); }
  .vote-option.selected::after { content: '✓'; }
  .opt-price { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: auto; padding-left: 8px; white-space: nowrap; }
  .sub-badge { font-size: 11px; color: var(--accent); margin-left: 6px; }
  .qty { display: flex; align-items: center; gap: 4px; background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 0 6px; }
  .qty-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--card2); border: 1px solid var(--border); color: var(--accent); font-size: 22px; font-weight: 700; cursor: pointer; font-family: inherit; line-height: 1; }
  .qty-btn:active { transform: scale(0.94); }
  .qty-n { min-width: 24px; text-align: center; font-weight: 800; color: var(--accent); font-size: 18px; }
  .vote-nav { display: flex; gap: 10px; margin-top: 20px; padding-bottom: 20px; }
  .custom-option-row { margin-top: 14px; background: var(--card2); border: 1.5px dashed var(--border); border-radius: 14px; padding: 14px; transition: border-color 0.2s; }
  .custom-option-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

  /* SUB-OPTIONS */
  .sub-options-block {
    margin-top: 10px; margin-left: 8px;
    border-left: 3px solid var(--accent); padding-left: 12px;
    display: flex; flex-direction: column; gap: 8px;
    animation: slideDown 0.18s ease;
  }
  @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .sub-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .sub-group { margin-bottom: 6px; }
  .sub-group-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
  .sub-group-btns { display: flex; flex-wrap: wrap; gap: 7px; }
  .sub-btn { background: var(--card2); border: 2px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    color: var(--text); font-family: inherit; transition: all 0.12s; }
  .sub-btn:active { transform: scale(0.96); }
  .sub-btn.selected { border-color: var(--accent); background: #2e2515; color: var(--accent); }
  .sub-btn.selected::after { content: ' ✓'; }
  /* option editor sub-rows */
  .opt-subs { margin-left: 12px; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
  .sub-item { display: flex; align-items: center; gap: 6px; }
  .sub-group-header { display: flex; align-items: center; gap: 6px; margin-top: 8px; margin-bottom: 4px; }
  .sub-group-name-input { flex:1; min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; color: var(--accent); font-family: inherit; font-size: 13px; font-weight: 600; outline: none; }
  .sub-val-input { flex:1; min-width: 0; background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 14px; outline: none; border-bottom: 1px solid var(--border); padding: 3px 6px; }
  .sub-val-input::placeholder { color: var(--muted); }
  .link-btn { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; padding: 2px 0; text-align: left; }

  /* VOTER PICKER */
  #votepicker .content { padding: 16px; flex: 1; }
  .picker-intro { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .voter-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .voter-tile {
    background: var(--card); border: 2px solid var(--border);
    border-radius: 14px; padding: 14px 8px 12px;
    cursor: pointer; text-align: center; position: relative;
    transition: all 0.15s; min-height: 80px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .voter-tile:active { transform: scale(0.96); }
  .voter-tile.done { border-color: var(--success); background: #1a2e1a; }
  .voter-tile.done::after { content: '✓'; position: absolute; top: 5px; right: 8px; color: var(--success); font-size: 13px; font-weight: 900; }
  .voter-tile.guest { border-style: dashed; border-color: var(--accent2); background: #2a1a10; }
  .voter-tile-name { font-size: 13px; font-weight: 700; line-height: 1.2; word-break: break-word; }
  .voter-tile-choice { font-size: 11px; color: var(--accent); margin-top: 2px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .voter-tile-badge { font-size: 10px; color: var(--accent2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .picker-actions { display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
  .guest-add-row { display: flex; gap: 8px; margin-bottom: 20px; }

  /* RESULTS / HISTORY */
  #results .content, #histdetail .content { padding: 16px; flex: 1; }
  .results-theme { font-family: Georgia, serif; font-size: 24px; font-weight: 900; color: var(--accent); margin-bottom: 4px; }
  .results-sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .total-bar { background: var(--card); border: 1.5px solid var(--accent); border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .total-label { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .total-value { font-family: Georgia, serif; font-size: 24px; font-weight: 900; color: var(--accent); }
  .result-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .result-item { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .result-count { font-family: Georgia, serif; font-size: 32px; font-weight: 900; color: var(--accent); min-width: 44px; text-align: center; }
  .result-count.zero { color: var(--muted); }
  .result-info { flex: 1; min-width: 0; }
  .result-name { font-size: 16px; font-weight: 600; display: flex; align-items: baseline; }
  .result-voters { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .result-bar-wrap { height: 5px; background: var(--border); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .result-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }
  .result-bar.empty { background: var(--border); }
  .pending-section { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
  .pending-title { font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .pending-names { font-size: 14px; color: var(--text); line-height: 1.8; }
  .results-actions { display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
  .per-list { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 4px 16px; margin-bottom: 20px; }
  .hd-per-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .hd-per-item:last-child { border-bottom: none; }
  .hd-per-name { font-weight: 600; }
  .hd-per-choice { color: var(--accent); font-weight: 600; text-align: right; }
  .per-note { font-size: 12px; color: var(--muted); margin-top: 2px; font-style: italic; }
  .per-cost { font-size: 12px; color: var(--muted); margin-top: 2px; text-align: right; }
  .hd-date { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  /* GROUP */
  #group .content { padding: 16px; flex: 1; }
  .group-section { margin-bottom: 26px; }
  .names-intro { color: var(--muted); font-size: 13px; margin-bottom: 12px; line-height: 1.45; }
  .names-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .name-item { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 12px; }
  .name-num { color: var(--muted); font-size: 12px; min-width: 20px; }
  .name-input { flex: 1; min-width: 0; background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 15px; outline: none; }
  .name-input::placeholder { color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 8px; }

  /* WELCOME WIZARD */
  #welcome .content { padding: calc(28px + env(safe-area-inset-top)) 20px 20px; flex: 1; display: flex; flex-direction: column; }
  .wiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .wiz-logo { width: 64px; height: 64px; border-radius: 16px; }
  .wiz-title { font-family: Georgia, serif; font-size: 28px; font-weight: 900; line-height: 1.2; margin-bottom: 10px; }
  .wiz-title span { color: var(--accent); }
  .wiz-body { color: var(--muted); font-size: 15px; margin-bottom: 14px; line-height: 1.5; }
  .wiz-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .wiz-list li { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 15px; display: flex; gap: 12px; align-items: center; }
  .wiz-list li b { color: var(--accent); font-family: Georgia, serif; font-size: 20px; min-width: 18px; }
  .wiz-privacy { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .wiz-actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-bottom: 12px; }
  .wiz-row { display: flex; gap: 10px; }
  .wiz-dots { display: flex; gap: 6px; margin-bottom: 18px; }
  .wiz-dot { width: 26px; height: 5px; border-radius: 3px; background: var(--border); }
  .wiz-dot.on { background: var(--accent); }
  .wiz-field { margin-bottom: 18px; }
  .wiz-hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .pack-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .pack-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 14px; display: flex; gap: 14px; align-items: center; cursor: pointer; text-align: left; color: var(--text); font-family: inherit; width: 100%; }
  .pack-card.selected { border-color: var(--accent); background: #2e2515; }
  .pack-emoji { font-size: 30px; }
  .pack-name { font-weight: 700; font-size: 15px; }
  .pack-desc { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card2); border: 1px solid var(--border); border-radius: 18px; padding: 24px; width: 100%; max-width: 400px; }
  .modal-title { font-family: Georgia, serif; font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .modal-body { color: var(--muted); font-size: 14px; margin-bottom: 16px; line-height: 1.45; }
  .modal-input { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; margin-bottom: 16px; }
  .modal-input:focus { border-color: var(--accent); }
  textarea.modal-input { resize: vertical; min-height: 90px; font-size: 13px; }
  .modal-actions { display: flex; gap: 8px; }

  /* INSTALL / NOTICES */
  .notice { background: var(--card); border: 1.5px solid var(--accent); border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
  .notice-icon { font-size: 26px; }
  .notice-text { flex: 1; font-size: 14px; line-height: 1.4; }
  .notice-text b { color: var(--accent); }
  .notice-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
  .ios-steps { color: var(--text); font-size: 15px; line-height: 1.6; margin: 0 0 20px 20px; }
  .ios-steps li { margin-bottom: 8px; }
  .resume-bar { background: #1a2e1a; border: 1.5px solid var(--success); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .resume-text { font-size: 14px; }
  .resume-text small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  .toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: white; padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 14px; z-index: 200; transition: transform 0.3s; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- WELCOME (first start) -->
<div id="welcome" class="screen">
  <div class="content" id="wizBody"></div>
</div>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="header">
    <div class="header-title" id="homeTitle">🍲 FoodsUp</div>
    <div class="header-sub" data-t="appSub"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="showScreen('group')" data-t="btnGroup"></button>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="nl" onclick="setLang('nl')">NL</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="ne" onclick="setLang('ne')">नेपाली</button>
      </div>
    </div>
  </div>
  <div class="content">
    <div id="installNotice" class="notice" style="display:none">
      <div class="notice-icon">📲</div>
      <div class="notice-text"><b data-t="installTitle"></b><br><span data-t="installBody"></span></div>
      <button class="btn btn-primary btn-sm" onclick="installApp()" data-t="btnInstall"></button>
      <button class="notice-close" onclick="dismissInstall()" aria-label="×">×</button>
    </div>
    <div id="noNamesNotice" class="notice" style="display:none">
      <div class="notice-icon">👥</div>
      <div class="notice-text"><b data-t="noNamesTitle"></b><br><span data-t="noNamesBody"></span></div>
      <button class="btn btn-primary btn-sm" onclick="showScreen('group')" data-t="btnAddNames"></button>
    </div>
    <div id="resumeBar" class="resume-bar" style="display:none">
      <div class="resume-text"><span id="resumeTitle"></span><small id="resumeSub"></small></div>
      <button class="btn btn-success btn-sm" onclick="resumeRound()" data-t="btnResume"></button>
    </div>
    <div class="welcome-text"><span data-t="homeWelcome1"></span> <span><span data-t="homeWelcome2"></span></span></div>
    <div class="welcome-sub" data-t="homeWelcomeSub"></div>
    <div class="section-label" data-t="labelThemes"></div>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="theme-actions">
      <button class="btn btn-primary btn-full btn-lg" onclick="startOrder()" data-t="btnStartOrder"></button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="section-label" style="margin:0" data-t="labelHistory"></div>
      <button class="btn btn-secondary btn-sm" id="clearHistBtn" onclick="confirmClearHistory()" style="display:none" data-t="btnClearAll"></button>
    </div>
    <div id="historyList"></div>
    <div style="height:20px"></div>
  </div>
</div>

<!-- GROUP: names, settings, sharing -->
<div id="group" class="screen">
  <div class="header">
    <div class="header-title" data-t="groupTitle"></div>
    <div class="header-sub" data-t="groupSub"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="showScreen('home')" data-t="btnBack"></button>
      <button class="btn btn-primary btn-sm" onclick="saveGroup()" data-t="btnDone"></button>
    </div>
  </div>
  <div class="content">
    <div class="group-section">
      <div class="section-label" data-t="labelGroupName"></div>
      <input class="add-option-input" style="width:100%" id="groupNameInput" maxlength="40" data-placeholder-t="groupNamePlaceholder" oninput="state.groupName=this.value;save()">
    </div>
    <div class="group-section">
      <div class="section-label" data-t="labelPeople"></div>
      <div class="names-intro" data-t="namesIntro"></div>
      <div class="names-list" id="namesList"></div>
      <button class="btn btn-secondary btn-sm" onclick="addNameField()" data-t="btnAddName"></button>
    </div>
    <div class="group-section">
      <div class="section-label" data-t="labelCurrency"></div>
      <div class="names-intro" data-t="currencyIntro"></div>
      <input class="add-option-input" style="width:110px" id="currencyInput" maxlength="4" placeholder="€" oninput="state.currency=this.value.trim();save()">
    </div>
    <div class="group-section">
      <div class="section-label" data-t="labelShare"></div>
      <div class="names-intro" data-t="shareIntro"></div>
      <div class="stack">
        <button class="btn btn-primary btn-full" onclick="shareSetupLink()" data-t="btnShareSetup"></button>
        <button class="btn btn-secondary btn-full" onclick="openImport()" data-t="btnImportSetup"></button>
        <button class="btn btn-secondary btn-full" onclick="downloadBackup()" data-t="btnBackup"></button>
        <button class="btn btn-secondary btn-full" onclick="document.getElementById('restoreInput').click()" data-t="btnRestore"></button>
        <input type="file" id="restoreInput" accept=".json,application/json" style="display:none" onchange="restoreBackup(this.files[0]);this.value=''">
      </div>
    </div>
    <div class="group-section" style="border-top:1px solid var(--border);padding-top:16px">
      <button class="btn btn-danger btn-sm" onclick="confirmReset()" data-t="btnResetAll"></button>
    </div>
  </div>
</div>

<!-- THEME EDIT -->
<div id="themeedit" class="screen">
  <div class="header">
    <div class="header-title" id="teTitle"></div>
    <div class="header-sub" data-t="teHeaderSub"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="showScreen('home')" data-t="btnBack"></button>
      <button class="btn btn-primary btn-sm" onclick="saveThemeEdit()" data-t="btnSave"></button>
    </div>
  </div>
  <div class="content">
    <div class="names-intro" data-t="teIntro"></div>
    <div class="section-label" data-t="teNameLabel"></div>
    <div class="te-name-row">
      <input class="add-option-input" id="teEmoji" placeholder="🍵" maxlength="5" style="max-width:66px;flex:none">
      <input class="add-option-input" id="teName" data-placeholder-t="tePlaceholderName" style="flex:1">
    </div>
    <div class="section-label" data-t="teOptionsLabel"></div>
    <div class="option-list" id="teOptionList"></div>
    <div class="add-option-row">
      <input class="add-option-input" id="teNewOption" data-placeholder-t="placeholderNewOption" onkeydown="if(event.key==='Enter')addTeOption()">
      <button class="btn btn-primary btn-sm" onclick="addTeOption()">+</button>
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
      <button class="btn btn-danger btn-sm" onclick="confirmDeleteTheme()" data-t="btnDeleteTheme"></button>
    </div>
    <div style="height:20px"></div>
  </div>
</div>

<!-- ORDER (options for this round) -->
<div id="order" class="screen">
  <div class="header">
    <div class="header-title" data-t="orderTitle"></div>
    <div class="header-sub" data-t="orderSub"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="showScreen('home')" data-t="btnBack"></button>
      <button class="btn btn-primary btn-sm" onclick="startVoting()" data-t="btnVote"></button>
    </div>
  </div>
  <div class="content">
    <div class="round-info">
      <div>
        <div class="round-theme" id="orderThemeName"></div>
        <div style="font-size:12px;color:var(--muted)" data-t="orderRoundSub"></div>
      </div>
      <div class="round-badge" id="orderOptionCount"></div>
    </div>
    <div class="options-header">
      <div class="section-label" style="margin:0" data-t="labelOptions"></div>
      <button class="btn btn-secondary btn-sm" onclick="resetToThemeDefaults()" data-t="btnReset"></button>
    </div>
    <div class="option-list" id="optionList"></div>
    <div class="add-option-row">
      <input class="add-option-input" id="newOptionInput" data-placeholder-t="placeholderNewOption" onkeydown="if(event.key==='Enter')addOption()">
      <button class="btn btn-primary btn-sm" onclick="addOption()">+</button>
    </div>
    <div class="save-to-theme-bar">
      <div class="save-to-theme-label" data-t="savePermanentLabel"></div>
      <button class="btn btn-warn btn-sm" onclick="saveCurrentToTheme()" data-t="btnSaveDefault"></button>
    </div>
    <button class="btn btn-success btn-full btn-lg" onclick="startVoting()" data-t="btnStartVoting"></button>
    <div style="height:20px"></div>
  </div>
</div>

<!-- VOTER PICKER -->
<div id="votepicker" class="screen">
  <div class="header">
    <div class="header-title" id="pickerThemeName"></div>
    <div class="header-sub" id="pickerHeaderSub"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="showScreen('home')" data-t="btnHome"></button>
      <button class="btn btn-primary btn-sm" onclick="showScreen('results')" data-t="resultsTitle"></button>
    </div>
  </div>
  <div class="content">
    <div class="picker-intro" data-t="pickerIntro"></div>
    <div class="voter-grid" id="voterGrid"></div>
    <div class="section-label" data-t="labelGuests"></div>
    <div class="guest-add-row">
      <input class="add-option-input" id="guestNameInput" data-placeholder-t="guestPlaceholder" onkeydown="if(event.key==='Enter')addGuest()">
      <button class="btn btn-warn btn-sm" onclick="addGuest()" data-t="btnAddGuest"></button>
    </div>
    <div class="picker-actions">
      <button class="btn btn-success btn-full btn-lg" onclick="showScreen('results')" data-t="btnToResults"></button>
    </div>
  </div>
</div>

<!-- VOTE (single person) -->
<div id="vote" class="screen">
  <div class="header">
    <div class="header-title" id="voteThemeName"></div>
    <div class="header-sub" id="voteHeaderSub"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="backToPicker()">← <span data-t="pickerTitle"></span></button>
    </div>
  </div>
  <div class="content">
    <div class="voter-name-display" id="voterName">—</div>
    <div class="voter-prompt" data-t="votePrompt"></div>
    <div class="vote-options" id="voteOptions"></div>
    <div class="custom-option-row" id="customRow">
      <div class="custom-option-label" data-t="customLabel"></div>
      <input class="add-option-input" style="width:100%" id="customVoteInput" data-placeholder-t="customPlaceholder" oninput="onCustomInput(this.value)">
    </div>
    <div class="custom-option-row">
      <div class="custom-option-label" data-t="noteLabel"></div>
      <input class="add-option-input" style="width:100%" id="noteInput" maxlength="120" data-placeholder-t="notePlaceholder" oninput="onNoteInput(this.value)">
    </div>
    <div class="vote-nav">
      <button class="btn btn-secondary" onclick="backToPicker()" data-t="btnBack"></button>
      <button class="btn btn-primary btn-lg" style="flex:1" onclick="confirmVote()" data-t="btnConfirmVote"></button>
    </div>
  </div>
</div>

<!-- RESULTS -->
<div id="results" class="screen">
  <div class="header">
    <div class="header-title" data-t="resultsTitle"></div>
    <div class="header-sub" id="resultSub"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="showScreen('votepicker')" data-t="btnBackToNames"></button>
    </div>
  </div>
  <div class="content">
    <div class="results-theme" id="resultsThemeName"></div>
    <div class="results-sub" id="resultsSub2"></div>
    <div id="resultsTotal"></div>
    <div class="result-list" id="resultList"></div>
    <div id="pendingSection" style="display:none" class="pending-section">
      <div class="pending-title" data-t="pendingTitle"></div>
      <div class="pending-names" id="pendingNames"></div>
    </div>
    <div id="resultsPerWrap">
      <div class="section-label" data-t="hdWhoWhat"></div>
      <div class="per-list" id="resultsPer"></div>
    </div>
    <div class="results-actions">
      <button class="btn btn-primary btn-full" onclick="showScreen('votepicker')" id="continueVoteBtn" style="display:none" data-t="btnContinueVote"></button>
      <button class="btn btn-secondary btn-full" onclick="shareCurrentRound()" data-t="btnShare"></button>
      <button class="btn btn-success btn-full btn-lg" onclick="finalizeRound()" data-t="btnFinalize"></button>
      <button class="btn btn-secondary btn-full" onclick="showScreen('home')" data-t="btnHomeKeep"></button>
    </div>
    <div style="height:20px"></div>
  </div>
</div>

<!-- HISTORY DETAIL -->
<div id="histdetail" class="screen">
  <div class="header">
    <div class="header-title" id="hdTitle"></div>
    <div class="header-sub" id="hdSub"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="showScreen('home')" data-t="btnBack"></button>
      <button class="btn btn-primary btn-sm" onclick="shareHistoryItem()" data-t="btnShare"></button>
      <button class="btn btn-danger btn-sm" onclick="deleteHistoryItem()" data-t="btnDelete"></button>
    </div>
  </div>
  <div class="content">
    <div class="results-theme" id="hdTheme"></div>
    <div class="hd-date" id="hdDate"></div>
    <div id="hdTotal"></div>
    <div class="result-list" id="hdTotals"></div>
    <div class="section-label" data-t="hdWhoWhat"></div>
    <div class="per-list" id="hdPerList"></div>
    <div style="height:20px"></div>
  </div>
</div>

<!-- MODAL: new theme -->
<div class="modal-overlay" id="addThemeModal">
  <div class="modal">
    <div class="modal-title" data-t="modalNewThemeTitle"></div>
    <div class="modal-body" data-t="modalNewThemeBody"></div>
    <input class="modal-input" id="newThemeName" data-placeholder-t="modalNamePlaceholder" maxlength="30" onkeydown="if(event.key==='Enter')addTheme()">
    <input class="modal-input" id="newThemeEmoji" data-placeholder-t="modalEmojiPlaceholder" maxlength="5" onkeydown="if(event.key==='Enter')addTheme()">
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('addThemeModal')" data-t="btnCancel"></button>
      <button class="btn btn-primary" style="flex:1" onclick="addTheme()" data-t="btnAdd"></button>
    </div>
  </div>
</div>

<!-- MODAL: import setup link -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <div class="modal-title" data-t="importModalTitle"></div>
    <div class="modal-body"><span data-t="importModalBody"></span><br><br><small data-t="importIphoneHint"></small></div>
    <textarea class="modal-input" id="importInput" data-placeholder-t="importPlaceholder"></textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('importModal')" data-t="btnCancel"></button>
      <button class="btn btn-primary" style="flex:1" onclick="importFromInput()" data-t="btnImport"></button>
    </div>
  </div>
</div>

<!-- MODAL: confirm -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-title" id="confirmTitle"></div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('confirmModal')" data-t="btnCancel"></button>
      <button class="btn btn-danger" style="flex:1" id="confirmOkBtn"></button>
    </div>
  </div>
</div>

<!-- MODAL: install on iPhone/iPad -->
<div class="modal-overlay" id="iosInstallModal">
  <div class="modal">
    <div class="modal-title" data-t="iosTitle"></div>
    <ol class="ios-steps">
      <li data-t="iosStep1"></li>
      <li data-t="iosStep2"></li>
      <li data-t="iosStep3"></li>
    </ol>
    <div class="modal-actions">
      <button class="btn btn-primary" style="flex:1" onclick="closeModal('iosInstallModal')" data-t="btnOk"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  return typeof val === 'function' ? val(...args) : (val ?? key);
}

const RENDERS = () => ({ welcome:renderWelcome, home:renderHome, group:renderGroup, order:renderOrder, vote:renderVote,
  votepicker:renderVotePicker, results:renderResults, histdetail:renderHistDetail, themeedit:renderThemeEdit });

function setLang(lang) {
  currentLang = lang;
  state.lang = lang;
  save();
  document.body.className = lang === 'ne' ? 'lang-ne' : '';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-placeholder-t]').forEach(el => { el.placeholder = t(el.dataset.placeholderT); });
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
  const active = document.querySelector('.screen.active');
  const render = active && RENDERS()[active.id];
  if (render) render();
}

function packThemes(packId, lang) {
  const pack = PACKS.find(p => p.id === packId) || PACKS[0];
  return pack.themes.map(th => ({
    id: th.id, emoji: th.emoji, name: { ...th.name },
    options: JSON.parse(JSON.stringify(th.options[lang] || th.options.en)),
  }));
}
function langText(obj) { return obj[currentLang] || obj.en || obj.nl || ''; }
function themeName(th) { return typeof th.name === 'object' ? langText(th.name) : th.name; }

// ═══════════════════════════════════════
//  OPTION HELPERS
// ═══════════════════════════════════════
function optLabel(o)  { return typeof o === 'string' ? o : o.label; }
function optSubs(o)   { return (o && typeof o === 'object' && Array.isArray(o.subs)) ? o.subs : []; }
function hasSubs(o)   { return optSubs(o).length > 0; }
function optPrice(o)  { return (o && typeof o === 'object' && typeof o.price === 'number') ? o.price : null; }
// Make list[i] an object so a field can be set on it
function optObj(list, i) { if (typeof list[i] === 'string') list[i] = { label: list[i] }; return list[i]; }
// Collapse back to a plain string when nothing but the label is left
function normOpt(o) {
  if (typeof o === 'string') return o;
  const out = { label: o.label };
  if (typeof o.price === 'number') out.price = o.price;
  if (o.subs && o.subs.length) out.subs = o.subs;
  return Object.keys(out).length === 1 ? o.label : out;
}
function setOptPrice(list, i, v) {
  const o = optObj(list, i), p = parsePrice(v);
  if (p === null) delete o.price; else o.price = p;
  list[i] = normOpt(o);
}
function parsePrice(v) {
  const s = String(v).trim().replace(',', '.');
  if (!s) return null;
  const n = parseFloat(s);
  return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
}
function fmtMoney(n, cur = state.currency) {
  const s = n.toLocaleString(t('locale'), { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return cur ? `${cur} ${s}` : s;
}
// A choice is "Label" or "Label · sub · sub"; it belongs to the option with that label
function optionFor(choice, options) {
  return options.find(o => { const l = optLabel(o); return choice === l || choice.startsWith(l + ' · '); });
}
function priceOf(choice, options) { const o = optionFor(choice, options); return o ? optPrice(o) : null; }
function hasPrices(options) { return options.some(o => optPrice(o) !== null); }
function asArr(x) { return Array.isArray(x) ? x : [x]; }
function personTotal(items, options) { return items.reduce((s, c) => s + (priceOf(c, options) || 0), 0); }
// ["Tea","Tea","Cake"] -> "2× Tea + Cake"
function fmtItems(items) {
  const m = new Map();
  items.forEach(c => m.set(c, (m.get(c) || 0) + 1));
  return [...m].map(([c, n]) => n > 1 ? `${n}× ${c}` : c).join(' + ');
}

//  STATE
// ═══════════════════════════════════════
// people = [{id, name}]; votes/notes are keyed by person id (or guest id), never by name.
// votes[key] is an array of choice strings; a repeated entry means quantity (2× tea).
let state = { themes:[], people:[], groupName:'', currency:null, selectedThemeId:null, currentOptions:[], votes:{}, notes:{},
  history:[], lang:null, guests:[], currentVoterKey:null, currentVoterName:null, roundActive:false, onboarded:false };
let editingThemeId = null;
let viewingHistIdx = null;

function save() {
  try { localStorage.setItem('gb6', JSON.stringify(state)); } catch(e){
    // localStorage not available (file://) — keep in memory only
    window._gbMemory = JSON.stringify(state);
  }
}
function load() {
  let saved = {};
  try {
    const raw = (()=>{ try { return localStorage.getItem('gb6'); } catch(e){ return window._gbMemory||null; } })();
    if (raw) saved = JSON.parse(raw) || {};
  } catch(e) { try { localStorage.removeItem('gb6'); } catch(_){} }
  // Only take over what was actually saved, so old saves can be detected and migrated
  state = { ...state, people: undefined, roundActive: undefined, onboarded: undefined, ...saved };
  if (!LANGS[state.lang]) state.lang = detectLang();
  currentLang = state.lang;
  // Anyone who already used the app (older versions had no flag) skips the welcome wizard
  if (typeof state.onboarded !== 'boolean') state.onboarded = Object.keys(saved).length > 0;
  if (!Array.isArray(state.themes)) state.themes = [];
  if (!state.themes.length && !state.onboarded) state.themes = packThemes('restaurant', currentLang);
  if (!state.votes || typeof state.votes !== 'object') state.votes = {};
  if (!state.notes || typeof state.notes !== 'object') state.notes = {};
  // Migrate old format: names were plain strings and votes were keyed by name
  if (!Array.isArray(state.people)) {
    state.people = (Array.isArray(state.names) ? state.names : []).map(n => ({ id: newId('p'), name: String(n) }));
    state.people.forEach(p => {
      if (state.votes[p.name] && !state.votes[p.id]) { state.votes[p.id] = state.votes[p.name]; delete state.votes[p.name]; }
    });
  }
  delete state.names; delete state.voterIndex;
  if (typeof state.groupName !== 'string') state.groupName = '';
  if (typeof state.currency !== 'string') state.currency = currentLang === 'ne' ? 'रु' : '€';
  if (!Array.isArray(state.history)) state.history = [];
  if (!Array.isArray(state.currentOptions)) state.currentOptions = [];
  if (!Array.isArray(state.guests)) state.guests = [];
  // A round with votes in it counts as active (old saves had no flag)
  if (typeof state.roundActive !== 'boolean') state.roundActive = Object.keys(state.votes).length > 0;
  if (!state.themes.some(x => x.id === state.selectedThemeId)) state.roundActive = false;
}
function detectLang() {
  const nav = (navigator.languages || [navigator.language || 'en']).map(l => String(l).slice(0,2).toLowerCase());
  return nav.find(l => LANGS[l]) || 'en';
}
let idSeq = 0;
function newId(prefix) { return prefix + '_' + Date.now().toString(36) + (idSeq++).toString(36) + Math.random().toString(36).slice(2,6); }

function showScreen(id) {
  if (id !== 'group' && document.getElementById('group').classList.contains('active')) { cleanPeople(); save(); }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const render = RENDERS()[id];
  if (render) render();
  window.scrollTo(0,0);
}

function wizGo(step) { wizStep = step; renderWelcome(); window.scrollTo(0,0); }
function wizPick(id) { wizPack = id; renderWelcome(); }
function wizFinish() {
  state.groupName = wizDraft.group.trim();
  state.people = mergePeople(splitNames(wizDraft.names));
  state.themes = packThemes(wizPack, currentLang);
  state.selectedThemeId = null; state.roundActive = false; state.votes = {}; state.notes = {};
  state.onboarded = true;
  save();
  showScreen('home');
  toast(t('toastWelcome'));
}
function splitNames(txt) { return String(txt).split(/[\r\n,;\t]+/).map(s => s.trim()).filter(Boolean); }
// Keep existing ids for names that are already known, so an ongoing round stays linked
function mergePeople(names) {
  const pool = [...state.people];
  return names.map(name => {
    const i = pool.findIndex(p => p.name === name);
    return i >= 0 ? pool.splice(i, 1)[0] : { id: newId('p'), name };
  });
}

// While a round is active, selectedThemeId belongs to that round; the home
// grid selection is kept separately until a new round actually starts.
let pickedThemeId = null;
function homeSelectedId() { return pickedThemeId || state.selectedThemeId; }
function selectTheme(id) {
  if (state.roundActive) pickedThemeId = id; else { state.selectedThemeId = id; save(); }
  renderHome();
}

function startOrder() {
  const id = homeSelectedId();
  if (!id || !state.themes.some(x => x.id === id)) { toast(t('toastNeedTheme')); return; }
  const begin = () => {
    const th = state.themes.find(x => x.id === id);
    state.selectedThemeId = id; pickedThemeId = null;
    state.currentOptions = JSON.parse(JSON.stringify(th.options)); state.votes = {}; state.notes = {}; state.guests = [];
    state.roundActive = false;
    save();
    showScreen('order');
  };
  if (state.roundActive && Object.keys(state.votes).length) confirm2(t('confirmNewRound'), t('confirmNewRoundBody'), begin);
  else begin();

// ═══════════════════════════════════════
//  SHARE SETUP VIA LINK  (#import=<code>, no server needed)
// ═══════════════════════════════════════
const APP_URL = location.protocol === 'file:' ? 'https://timdams.github.io/FoodsUp/' : location.origin + location.pathname;
function b64urlFromBytes(bytes){
  let s=''; for (let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function bytesFromB64url(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='=';
  const s=atob(str), b=new Uint8Array(s.length);
  for (let i=0;i<s.length;i++) b[i]=s.charCodeAt(i);
  return b;
}
async function pipeBytes(bytes, stream){
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}
// Code = 'z' + deflated JSON, or 'j' + plain JSON when compression isn't available
async function encodeSetup(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    try { return 'z'+b64urlFromBytes(await pipeBytes(bytes, new CompressionStream('deflate'))); } catch(e){}
  }
  return 'j'+b64urlFromBytes(bytes);
}
async function decodeSetup(code){
  const bytes=bytesFromB64url(code.slice(1));
  const raw = code[0]==='z' ? await pipeBytes(bytes, new DecompressionStream('deflate')) : bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
async function shareSetupLink(){
  cleanPeople(); save();
  const setup={ v:1, g:state.groupName.trim(), c:state.currency, p:state.people.map(p=>p.name), t:state.themes };
  const url=APP_URL+'#import='+await encodeSetup(setup);
  const name=setup.g||t('unnamedGroup');
  shareText(t('shareSetupTitle'), t('shareSetupText', name)+'\n'+url);
}
function extractCode(text){
  const s=String(text||'').trim();
  const m=s.match(/import=([A-Za-z0-9_-]+)/);
  if (m) return m[1];
  return /^[zj][A-Za-z0-9_-]{8,}$/.test(s) ? s : null;
}
function openImport(){ document.getElementById('importInput').value=''; openModal('importModal'); }
function importFromInput(){
  const code=extractCode(document.getElementById('importInput').value);
  if (!code) { toast(t('toastImportFailed')); return; }
  closeModal('importModal');
  importSetupCode(code);
}
async function importSetupCode(code){
  let setup;
  try {
    setup=await decodeSetup(code);
    if (!setup || !Array.isArray(setup.p) || !Array.isArray(setup.t)) throw new Error('bad setup');
  } catch(e) { console.warn('import failed', e); toast(t('toastImportFailed')); return; }
  const themes=setup.t.filter(th=>th && typeof th.id==='string' && Array.isArray(th.options))
    .map(th=>({ id:th.id, emoji:String(th.emoji||'📋'), name:th.name, options:th.options }));
  const names=setup.p.map(String).map(s=>s.trim()).filter(Boolean);
  confirm2(t('confirmImport', setup.g||t('unnamedGroup')), t('confirmImportBody', names.length, themes.length), ()=>{
    state.people=mergePeople(names);
    state.themes=themes;
    state.groupName=String(setup.g||'');
    if (typeof setup.c==='string') state.currency=setup.c;
    if (!state.themes.some(x=>x.id===state.selectedThemeId)) { state.selectedThemeId=null; state.roundActive=false; }
    state.onboarded=true;
    save(); showScreen('home'); toast(t('toastImported'));
  }, t('btnImport'));
}
function checkImportHash(){
  const code=extractCode(location.hash);
  if (!code) return false;
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
  importSetupCode(code);
  return true;
}

function downloadBackup(){
  cleanPeople(); save();
  const blob=new Blob([JSON.stringify({ app:'FoodsUp', v:1, exported:new Date().toISOString(), state }, null, 1)], { type:'application/json' });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`foodsup-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(t('toastBackupSaved'));
}
function restoreBackup(file){
  if (!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try { data=JSON.parse(reader.result); } catch(e) { toast(t('toastBackupInvalid')); return; }
    const s=data && (data.state || data);
    if (!s || !Array.isArray(s.themes)) { toast(t('toastBackupInvalid')); return; }
    confirm2(t('confirmRestore'), t('confirmRestoreBody'), ()=>{
      state=s; state.onboarded=true; save();
      load(); setLang(currentLang); showScreen('home'); toast(t('toastBackupRestored'));
    }, t('btnRestoreOk'));
  };
  reader.readAsText(file);
}

// ═══════════════════════════════════════
//  VOTE (single person)
// ═══════════════════════════════════════
// votes[key] = array of choice strings, e.g. ["Tea","Tea","Cake"] or ["Set · Coffee · Jam"]
let activeSubSels = {};     // sub-selections for the option being expanded: {group: value}
let expandedOption = null;  // which option label is currently expanded for sub-selection

function getSelections(key){ return state.votes[key] || []; }
function matchesLabel(s, lbl){ return s === lbl || s.startsWith(lbl + ' · '); }
function isSelected(key, lbl){ return getSelections(key).some(s => matchesLabel(s, lbl)); }
function getCompositeFor(key, lbl){ return getSelections(key).find(s => matchesLabel(s, lbl)) || null; }
function isKnownChoice(s){ return state.currentOptions.some(o => matchesLabel(s, optLabel(o))); }

function renderVote(){
  const th=roundTheme();
  const key=state.currentVoterKey;
  if(!th||!key){showScreen('home');return;}
  const voters=allVoters();
  document.getElementById('voteThemeName').textContent=th.emoji+' '+themeName(th);
  document.getElementById('voteHeaderSub').textContent=t('votedCount',votedCount(voters),voters.length);
  document.getElementById('voterName').textContent=state.currentVoterName;
  renderVoteOptions();
  const customSels=getSelections(key).filter(s=>!isKnownChoice(s));
  document.getElementById('customVoteInput').value=customSels.join(', ');
  document.getElementById('customRow').style.borderColor=customSels.length?'var(--accent)':'';
  document.getElementById('noteInput').value=state.notes[key]||'';
}

function renderVoteOptions(){
  const key=state.currentVoterKey;
  document.getElementById('voteOptions').innerHTML=state.currentOptions.map(o=>{
    const lbl=optLabel(o), sel=isSelected(key,lbl), subs=hasSubs(o), price=optPrice(o);
    const composite=getCompositeFor(key,lbl);
    const subBadge = composite && composite.includes(' · ')
      ? `<span class="sub-badge">${esc(composite.split(' · ').slice(1).join(' · '))}</span>` : '';
    const priceTag = price!==null ? `<span class="opt-price">${esc(fmtMoney(price))}</span>` : '';
    const n=getSelections(key).filter(s=>s===lbl).length;
    const qty = sel && !subs ? `<div class="qty">
        <button class="qty-btn" onclick="changeQty('${escA(lbl)}',-1)" aria-label="−">−</button>
        <div class="qty-n">${n}</div>
        <button class="qty-btn" onclick="changeQty('${escA(lbl)}',1)" aria-label="+">+</button>
      </div>` : '';
    return `<div>
      <div class="vote-row">
        <button class="vote-option ${sel?'selected':''}" onclick="toggleOption('${escA(lbl)}')"><span>${esc(lbl)}${subBadge}</span>${priceTag}</button>
        ${qty}
      </div>
      ${(sel||expandedOption===lbl)&&subs?renderSubBlocks(o,lbl):''}
    </div>`;
  }).join('');
}

function renderSubBlocks(opt, lbl){
  const subs=optSubs(opt);
  if(!subs.length) return '';
  const composite=getCompositeFor(state.currentVoterKey, lbl)||'';
  const existingParts=composite.split(' · ').slice(1);
  const html=subs.map((sg,gi)=>{
    const chosen = expandedOption===lbl ? (activeSubSels[sg.group]||'') : (existingParts[gi]||'');
    const btns=sg.values.filter(v=>v.trim()).map(v=>`
      <button class="sub-btn ${chosen===v?'selected':''}" onclick="selectSubVal('${escA(lbl)}','${escA(sg.group)}','${escA(v)}')">${esc(v)}</button>`).join('');
    return `<div class="sub-group">
      ${sg.group?`<div class="sub-group-label">${esc(sg.group)}</div>`:''}
      <div class="sub-group-btns">${btns}</div>
    </div>`;
  }).join('');
  return `<div class="sub-options-block"><div class="sub-label">${esc(t('subLabel'))}</div>${html}</div>`;
}

function toggleOption(lbl){
  const key=state.currentVoterKey;
  const opt=state.currentOptions.find(o=>optLabel(o)===lbl);
  if(isSelected(key,lbl)){
    state.votes[key]=getSelections(key).filter(s=>!matchesLabel(s,lbl));
    if(!state.votes[key].length) delete state.votes[key];
    if(expandedOption===lbl){ expandedOption=null; activeSubSels={}; }
  } else if(hasSubs(opt)){
    // Expand for sub-selection; pre-fill the first values
    expandedOption=lbl; activeSubSels={};
    optSubs(opt).forEach(sg=>{ const first=sg.values.find(v=>v.trim()); if(first) activeSubSels[sg.group]=first; });
    commitSubVote(lbl);
  } else {
    (state.votes[key]=getSelections(key)).push(lbl);
    expandedOption=null;
  }
  save();
  renderVoteOptions();
}

function changeQty(lbl, delta){
  const key=state.currentVoterKey;
  const arr=state.votes[key]=getSelections(key);
  if(delta>0) arr.push(lbl);
  else { const idx=arr.lastIndexOf(lbl); if(idx>=0) arr.splice(idx,1); }
  if(!arr.length) delete state.votes[key];
  save();
  renderVoteOptions();
}

function selectSubVal(lbl, group, val){
  if(expandedOption!==lbl){
    // Re-open an already chosen option: start from its current sub-choices
    const opt=state.currentOptions.find(o=>optLabel(o)===lbl);
    const parts=(getCompositeFor(state.currentVoterKey,lbl)||'').split(' · ').slice(1);
    expandedOption=lbl; activeSubSels={};
    optSubs(opt).forEach((sg,gi)=>{ if(parts[gi]) activeSubSels[sg.group]=parts[gi]; });
  }
  activeSubSels[group]=val;
  commitSubVote(lbl);
  save();
  renderVoteOptions();
}

function commitSubVote(lbl){
  const key=state.currentVoterKey;
  const opt=state.currentOptions.find(o=>optLabel(o)===lbl);
  const parts=[lbl];
  optSubs(opt).forEach(sg=>{ if(activeSubSels[sg.group]) parts.push(activeSubSels[sg.group]); });
  const composite=parts.join(' · ');
  const arr=state.votes[key]=getSelections(key);
  const idx=arr.findIndex(s=>matchesLabel(s,lbl));
  if(idx>=0) arr[idx]=composite; else arr.push(composite);
}

function onCustomInput(val){
  const key=state.currentVoterKey;
  const trimmed=val.trim();
  // Replace previous custom entries, keep the selections of listed options
  state.votes[key]=getSelections(key).filter(isKnownChoice);
  if(trimmed) state.votes[key].push(trimmed);
  document.getElementById('customRow').style.borderColor=trimmed?'var(--accent)':'';
  if(!state.votes[key].length) delete state.votes[key];
  expandedOption=null; activeSubSels={};
  save();
  renderVoteOptions(); // not renderVote(): keeps the cursor in the input
}

function onNoteInput(val){
  const key=state.currentVoterKey;
  if(val.trim()) state.notes[key]=val; else delete state.notes[key];
  save();
}

function confirmVote(){
  const key=state.currentVoterKey;
  const choices=getSelections(key);
  if(!choices.length){toast(t('toastNeedChoice'));return;}
  // Add custom choices as plain options for the next people
  [...new Set(choices)].forEach(choice=>{
    if(!isKnownChoice(choice)){
      state.currentOptions.push(choice);
      toast(t('toastCustomAdded',choice));
    }
  });
  expandedOption=null; activeSubSels={};
  save();
  backToPicker();
}

// ═══════════════════════════════════════
//  RESULTS
// ═══════════════════════════════════════
// Votes and notes of the current round keyed by display name; duplicate names get " (2)", " (3)"…
function roundByName(){
  const votes={}, notes={};
  allVoters().forEach(v=>{
    const val=state.votes[v.key];
    if(!val||!val.length) return;
    let name=v.name, n=2;
    while(votes[name]) name=`${v.name} (${n++})`;
    votes[name]=val;
    const note=(state.notes[v.key]||'').trim();
    if(note) notes[name]=note;
  });
  return {votes, notes};
}

// Shared by the results screen and history detail; votes/notes are keyed by display name
function summaryHtml(votes, options, notes, cur){
  let sorted=summarize(votes,options);
  // Once something is ordered, choices nobody picked are just noise
  if(sorted.some(([,c])=>c>0)) sorted=sorted.filter(([,c])=>c>0);
  const max=Math.max(1, ...sorted.map(([,c])=>c));
  const priced=hasPrices(options);
  const totals=sorted.map(([o,c])=>{
    const who=Object.entries(votes).map(([n,arr])=>{
      const k=asArr(arr).filter(x=>x===o).length;
      return k ? (k>1?`${n} ×${k}`:n) : null;
    }).filter(Boolean).join(', ');
    const p=priceOf(o,options);
    return `<div class="result-item">
      <div class="result-count ${c===0?'zero':''}">${c}</div>
      <div class="result-info">
        <div class="result-name"><span>${esc(o)}</span>${p!==null&&c>0?`<span class="opt-price">${esc(fmtMoney(p*c,cur))}</span>`:''}</div>
        ${c>0?`<div class="result-voters">${esc(who)}</div>`:''}
        <div class="result-bar-wrap"><div class="result-bar ${c===0?'empty':''}" style="width:${c/max*100}%"></div></div>
      </div></div>`;
  }).join('');
  const per=Object.entries(votes).sort((a,b)=>a[0].localeCompare(b[0])).map(([n,arr])=>{
    const items=asArr(arr), note=notes&&notes[n];
    return `<div class="hd-per-item">
      <div><div class="hd-per-name">${esc(n)}</div>${note?`<div class="per-note">📝 ${esc(note)}</div>`:''}</div>
      <div><div class="hd-per-choice">${esc(fmtItems(items))}</div>${priced?`<div class="per-cost">${esc(fmtMoney(personTotal(items,options),cur))}</div>`:''}</div>
    </div>`;
  }).join('');
  const total=priced ? Object.values(votes).reduce((s,arr)=>s+personTotal(asArr(arr),options),0) : null;
  const totalHtml=total!==null ? `<div class="total-bar"><div class="total-label">${esc(t('totalLabel'))}</div><div class="total-value">${esc(fmtMoney(total,cur))}</div></div>` : '';
  return { totals, per, totalHtml };
}

function renderResults(){
  const th=roundTheme();
  if(!th){showScreen('home');return;}
  const voters=allVoters(), pending=voters.filter(v=>!(state.votes[v.key]&&state.votes[v.key].length));
  document.getElementById('resultsThemeName').textContent=th.emoji+' '+themeName(th);
  document.getElementById('resultsSub2').textContent=t('votedCount',votedCount(voters),voters.length);
  document.getElementById('resultSub').textContent=fmtDT(new Date());
  const {votes, notes}=roundByName();
  const s=summaryHtml(votes, state.currentOptions, notes, state.currency);
  document.getElementById('resultsTotal').innerHTML=s.totalHtml;
  document.getElementById('resultList').innerHTML=s.totals;
  document.getElementById('resultsPer').innerHTML=s.per;
  document.getElementById('resultsPerWrap').style.display=s.per?'':'none';
  document.getElementById('pendingSection').style.display=pending.length?'':'none';
  document.getElementById('continueVoteBtn').style.display=pending.length?'':'none';
  document.getElementById('pendingNames').textContent=pending.map(v=>v.name).join(' · ');
}
function finalizeRound(){
  const th=roundTheme();
  const {votes, notes}=roundByName();
  state.history.push({ id:Date.now(), themeId:th.id, theme:themeName(th), emoji:th.emoji,
    datetime:fmtDT(new Date()), options:JSON.parse(JSON.stringify(state.currentOptions)), votes, notes,
    currency:state.currency, guests:state.guests.map(g=>g.name) });
  state.votes={}; state.notes={}; state.guests=[]; state.currentVoterKey=null; state.currentVoterName=null; state.roundActive=false;
  save(); toast(t('toastRoundSaved')); showScreen('home');
}

// ═══════════════════════════════════════
//  SHARE RESULTS
// ═══════════════════════════════════════
function buildShareText(title, datetime, votes, options, notes, cur){
  const priced=hasPrices(options);
  const totals=summarize(votes,options).filter(([,c])=>c>0).map(([o,c])=>{
    const p=priceOf(o,options);
    return `${c}× ${o}` + (priced&&p!==null ? ` (${fmtMoney(p*c,cur)})` : '');
  });
  const lines=[title, datetime, '', ...totals];
  if(priced){
    const total=Object.values(votes).reduce((s,arr)=>s+personTotal(asArr(arr),options),0);
    lines.push('', `${t('totalLabel')}: ${fmtMoney(total,cur)}`);
  }
  lines.push('', '---');
  Object.entries(votes).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([n,arr])=>{
    const items=asArr(arr), note=notes&&notes[n];
    lines.push(`${n}: ${fmtItems(items)}` + (note?` — ${note}`:'') + (priced?` (${fmtMoney(personTotal(items,options),cur)})`:''));
  });
  return lines.join('\n');
}
async function shareText(title, text){
  if(navigator.share){
    try { await navigator.share({ title, text }); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast(t('toastCopied')); return; } catch(e){}
  // Last resort for old browsers / file://
  try {
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove();
    toast(ok ? t('toastCopied') : t('toastShareFailed'));
  } catch(e){ toast(t('toastShareFailed')); }
}
function shareCurrentRound(){
  const th=roundTheme(); if(!th) return;
  const title=th.emoji+' '+themeName(th);
  const {votes, notes}=roundByName();
  shareText(title, buildShareText(title, fmtDT(new Date()), votes, state.currentOptions, notes, state.currency));
}
function shareHistoryItem(){
  const h=state.history[viewingHistIdx]; if(!h) return;
  const title=h.emoji+' '+h.theme;
  shareText(title, buildShareText(title, h.datetime, h.votes, h.options, h.notes, h.currency ?? state.currency));
}

// ═══════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function confirm2(title,body,cb,okLabel){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmBody').textContent=body;
  const ok=document.getElementById('confirmOkBtn');
  ok.textContent=okLabel||t('btnOk');
  ok.className='btn '+(okLabel?'btn-primary':'btn-danger');
  ok.onclick=()=>{closeModal('confirmModal');cb();};
  openModal('confirmModal');
}
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{ if(e.target===el) el.classList.remove('open'); });
});

// ═══════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════
function summarize(votes,options){
  const c={};
  options.forEach(o=>{ c[optLabel(o)]=0; });
  Object.values(votes).forEach(arr=>{
    asArr(arr).forEach(v=>{ c[v]=(c[v]||0)+1; });
  });
  // "Momos 0" is noise when "Momos · Chicken" was ordered
  options.forEach(o=>{
    const l=optLabel(o);
    if(c[l]===0 && Object.keys(c).some(k=>k.startsWith(l+' · '))) delete c[l];
  });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}
function fmtDT(d){
  const loc=t('locale');
  return d.toLocaleDateString(loc,{day:'2-digit',month:'2-digit',year:'numeric'})
    +' · '+d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// For a JS string literal ('…') inside an HTML attribute: JS-escape first, then HTML-escape
function escA(s){ return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')); }

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

function confirmReset(){
  confirm2(t('confirmReset'),t('confirmResetBody'),()=>{
    try { localStorage.removeItem('gb6'); } catch(e){} window._gbMemory=null; try { location.reload(); } catch(e){ location.href=location.href; }
  });
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
function init() {
  try {
    load();
  } catch(e) {
    console.error('load() failed:', e);
  }
  // Brave blocks localStorage on file:// only — when served as a website it works fine
  (async () => {
    try {
      const isBrave = (navigator.brave && await navigator.brave.isBrave()) || false;
      if (isBrave && location.protocol === 'file:') {
        const warn = document.createElement('div');
        warn.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c4622d;color:#fff;padding:12px 16px;font-size:14px;font-weight:600;z-index:9999;text-align:center;';
        warn.textContent = t('braveWarn');
        document.body.prepend(warn);
      }
    } catch(e){}
  })();
  setupPwa();
  try {
    setLang(currentLang);
    showScreen(state.onboarded ? 'home' : 'welcome');
  } catch(e) {
    console.error('render failed:', e);
    const box = document.createElement('div');
    box.style.cssText = 'color:#e8a23a;padding:20px;font-size:16px';
    box.textContent = t('loadError') + ' ' + e.message;
    document.body.appendChild(box);
  }
  checkImportHash();
  window.addEventListener('hashchange', checkImportHash);
}

// ═══════════════════════════════════════
//  PWA: offline cache + install
// ═══════════════════════════════════════
let deferredInstall = null;
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
function isIos() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function installDismissed() {
  try { return localStorage.getItem('foodsup.installDismissed') === '1'; } catch(e) { return false; }
}
function updateInstallNotice() {
  const el = document.getElementById('installNotice');
  if (!el) return;
  const canOffer = location.protocol !== 'file:' && !isStandalone() && !installDismissed() && (deferredInstall || isIos());
  el.style.display = canOffer ? '' : 'none';
}
async function installApp() {
  if (deferredInstall) {
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch(e) {}
    deferredInstall = null;
    updateInstallNotice();
  } else if (isIos()) {
    openModal('iosInstallModal');
  }
}
function dismissInstall() {
  try { localStorage.setItem('foodsup.installDismissed', '1'); } catch(e) {}
  updateInstallNotice();
}
function setupPwa() {
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstall = e;
    updateInstallNotice();
  });
  window.addEventListener('appinstalled', () => { deferredInstall = null; updateInstallNotice(); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  }
  // Ask the browser not to evict our data (matters most on iOS)
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
